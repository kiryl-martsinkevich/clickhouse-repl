# clickhouse-repl — example configuration (annotated).
# See docs/SPEC.md §9 for the schema and validation rules.
# Secrets are always references: ${vault:<path>#<key>} or ${env:<NAME>}.

version: 1

# ---------------------------------------------------------------------------
# Production (source) clusters. Only ever read.
# ---------------------------------------------------------------------------
sources:
  prod:
    cluster_name: prod
    tls: true
    reader:                                  # L1-limited read-only user (SPEC §4.2)
      user: repl_reader
      password: ${vault:secret/chrepl/prod#reader_password}
    guard:                                   # system-tables + KILL own-user queries
      user: repl_guard
      password: ${vault:secret/chrepl/prod#guard_password}
    shards:
      - name: s1
        read_replicas: [ch-prod-s1-r3.internal:8443]   # dedicated, out of the prod LB (preferred)
        watch_hosts:   [ch-prod-s1-r1.internal:8443, ch-prod-s1-r2.internal:8443, ch-prod-s1-r3.internal:8443]
      - name: s2
        read_replicas: [ch-prod-s2-r3.internal:8443]
        watch_hosts:   [ch-prod-s2-r1.internal:8443, ch-prod-s2-r2.internal:8443, ch-prod-s2-r3.internal:8443]
    max_replica_delay: 30s                   # skip a read replica lagging more than this

# ---------------------------------------------------------------------------
# Non-production (target) clusters.
# ---------------------------------------------------------------------------
targets:
  qa1:
    hosts: [ch-qa1-01.internal:8443, ch-qa1-02.internal:8443]
    cluster_name: qa1
    tls: true
    writer:
      user: repl_writer
      password: ${vault:secret/chrepl/qa1#writer_password}
    environment_marker: qa1                  # must equal SELECT value FROM repl_meta.environment
    zookeeper_path_template: /clickhouse/qa1/tables/{shard}/{database}/{table}
    shard_mapping: distributed               # same_shards | distributed | single
    database_template: "{database}"          # e.g. "{database}_{team}" for per-team namespaces
    table_overrides:
      ttl: "cob_date + INTERVAL 90 DAY"      # applied where the table has cob_date; keeps QA small
      storage_policy: default
  uat:
    hosts: [ch-uat-01.internal:8443]
    cluster_name: uat
    tls: true
    writer:
      user: repl_writer
      password: ${vault:secret/chrepl/uat#writer_password}
    environment_marker: uat
    zookeeper_path_template: /clickhouse/uat/tables/{shard}/{database}/{table}
    shard_mapping: single
    database_template: "{database}"

# ---------------------------------------------------------------------------
# Prod Guard (SPEC §4). Thresholds apply per watched host unless noted.
# ---------------------------------------------------------------------------
guard:
  poll_interval: 5s
  stale_after: 15s                           # poll older than this => UNKNOWN => RED
  stable_window: 60s                         # continuous GREEN samples needed to admit chunks
  release_ratio: 0.8                         # leave RED only when below 80% of thresholds
  thresholds:
    foreign_query:                           # any single non-repl_* query exceeding one of these blocks
      max_elapsed: 300s
      max_memory: 20GiB
      max_read_rows: 5000000000
    max_foreign_queries: 50
    max_cpu_utilisation: 0.60
    max_load_avg_per_core: 0.70
    max_memory_ratio: 0.70
    max_active_merges: 20
    max_mutation_bytes: 100GiB
    max_replication_queue: 100
    max_replica_delay: 30s
    max_delayed_inserts: 0
  concurrency:
    global: 2                                # concurrent chunk reads across the cluster
    per_host: 1
  preemption:
    enabled: true                            # cannot be disabled in prod configs (validation)
    kill_grace: 5s
  circuit_breaker:
    max_preemptions: 5
    within: 30m
    open_for: 1h
  blackout_windows:
    - name: eod-batch
      cron: "0 17 * * 1-5"                   # 17:00 Mon–Fri, cluster timezone
      duration: 5h
      timezone: Europe/London
    - name: month-end
      cron: "0 0 L * *"
      duration: 36h
      timezone: Europe/London

# ---------------------------------------------------------------------------
# Masking (SPEC §6).
# ---------------------------------------------------------------------------
masking:
  realm: nonprod                             # all targets in this realm see identical masked values
  key:
    ref: ${vault:transit/chrepl/nonprod}     # versioned master key; workers fetch at start-up
    version: 3
  dictionaries:
    first_names:  { file: dictionaries/first_names_v1.txt }
    last_names:   { file: dictionaries/last_names_v1.txt }
    company_names: { file: dictionaries/company_names_v2.txt }
  domains:
    customer_id:
      strategy: fpe_ff1                      # bijective: stays unique (used as a key)
      alphabet: digits
      approved_by: security-team             # required for fpe_ff1
    account_number:
      strategy: tokenize
      normalise: [trim]
      collision_check: true
    email:
      strategy: email
      local_part: tokenize
      domain: map_to_example                 # keep | map_to_example | tokenize
      normalise: [trim, lower]
    phone:
      strategy: tokenize                     # keeps +, spaces, dashes and length
    first_name:
      strategy: dictionary
      dictionary: first_names
    last_name:
      strategy: dictionary
      dictionary: last_names
    counterparty_name:
      strategy: dictionary
      dictionary: company_names
    customer_dates:
      strategy: date_shift
      max_days: 180                          # same offset for every date of the same customer
    amount_noise:
      strategy: numeric_noise
      relative: 0.05                         # ±5%, rounded to column scale
    free_text:
      strategy: "null"

# ---------------------------------------------------------------------------
# Table specs. Every column needs a policy: `pass` or a mask rule.
# Columns not listed => validation error (unless non_pii + approved_by).
# ---------------------------------------------------------------------------
tables:
  - source: trading.trades
    cob_column: trade_date                   # partition key is toYYYYMM(trade_date)
    mv_mode: base_only
    chunk: { max_bytes: 2GiB, max_seconds: 120 }
    columns:
      trade_id:          pass
      trade_date:        pass
      inserted_at:       pass
      instrument_id:     pass
      customer_id:       { mask: customer_id }
      account_number:    { mask: account_number }
      counterparty_name: { mask: counterparty_name }
      quantity:          pass
      price:             pass
      notional:          { mask: amount_noise, entity_column: customer_id }
      trader_comment:    { mask: free_text }
      tags:              pass                # Array(LowCardinality(String))
      attributes:                            # Map(String, String): mask selected keys' values
        map_values:
          client_email: { mask: email }
          client_phone: { mask: phone }
        default: pass

  - source: trading.positions
    cob_column: cob_date
    mv_mode: base_only
    columns:
      cob_date:       pass
      customer_id:    { mask: customer_id }  # same domain as trades.customer_id => joins still work
      account_number: { mask: account_number }
      instrument_id:  pass
      quantity:       pass
      market_value:   { mask: amount_noise, entity_column: customer_id }

  - source: crm.customers
    full_copy: true                          # small dimension table, no COB
    max_full_copy_bytes: 5GiB
    columns:
      customer_id:   { mask: customer_id }
      first_name:    { mask: first_name }
      last_name:     { mask: last_name }
      email:         { mask: email }
      phone:         { mask: phone }
      date_of_birth: { mask: customer_dates, entity_column: customer_id }
      onboarded_at:  { mask: customer_dates, entity_column: customer_id }
      profile_json:                          # JSON stored in String: mask by path
        json_paths:
          $.contact.email: { mask: email }
          $.contact.phone: { mask: phone }
          $.notes:         { mask: free_text }
        default: pass
      segment:       pass

  - source: refdata.instruments
    full_copy: true
    max_full_copy_bytes: 2GiB
    classification: non_pii
    approved_by: data-governance (JIRA DG-142)
    unlisted_columns: pass

# ---------------------------------------------------------------------------
# Datasets offered in the portal.
# ---------------------------------------------------------------------------
datasets:
  - name: trading-eod
    description: Trades and positions for a COB date, plus customers and instruments
    tables: [trading.trades, trading.positions, crm.customers, refdata.instruments]
  - name: trades-only
    tables: [trading.trades]

# ---------------------------------------------------------------------------
# Continuous (near-real-time) jobs (SPEC §8).
# ---------------------------------------------------------------------------
continuous:
  - name: trades-to-qa1
    table: trading.trades
    targets: [qa1]
    mode: append_watermark
    watermark_column: inserted_at
    interval: 60s
    overlap: 10m
    dedupe: replace_partition                # replace_partition | replacing_merge_tree
    only_recent_partitions: 2                # never backfill old months via continuous mode
    lag_slo: 5m
    lag_alert_after: 30m

  - name: positions-to-qa1
    table: trading.positions
    targets: [qa1]
    mode: partition_fingerprint
    interval: 5m
    only_recent_partitions: 3
    sync_drops: true
    lag_slo: 15m

  - name: refdata-nightly
    tables: [refdata.instruments, crm.customers]
    targets: [qa1, uat]
    mode: scheduled_full_refresh
    cron: "0 3 * * *"
    timezone: Europe/London

# ---------------------------------------------------------------------------
# Access control and quotas (SPEC §7.4). Groups come from OIDC claims.
# ---------------------------------------------------------------------------
scheduling:
  queue_weights: { continuous: 3, adhoc: 1 }
  max_running_jobs_per_user: 2

access:
  - group: qa-trading
    role: requester
    datasets: [trading-eod, trades-only]
    targets: [qa1]
    quota:
      max_bytes_per_job: 50GiB
      max_bytes_per_day: 500GiB
      max_cob_dates_per_job: 10
      max_concurrent_jobs: 4
  - group: uat-leads
    role: requester
    datasets: [trading-eod]
    targets: [qa1, uat]
    quota:
      max_bytes_per_job: 200GiB
      max_bytes_per_day: 1TiB
      max_cob_dates_per_job: 31
      max_concurrent_jobs: 4
  - group: data-platform
    role: admin
