# clickhouse-repl demo, laid out like the physical clusters it is built for:
#   prod1-3 + dr1-3   one shard, 6 replicas (ReplicatedMergeTree), Keeper on every machine (one ensemble;
#                     DR Keepers cannot lead)
#   qa1-1..3          the non-production target: one shard, 3 replicas, its own Keepers
# plus Postgres, a development-only OIDC provider and the app. See demo/run.sh. Not for production.
name: chrepl-demo

x-clickhouse-env: &chenv
  CLICKHOUSE_SKIP_USER_SETUP: "1"
  CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"

x-clickhouse: &clickhouse
  image: ${CLICKHOUSE_IMAGE:-clickhouse/clickhouse-server:25.8}

services:
  # The ACTIVE data centre (3 replicas + Keepers). The tool must never connect here: these hosts are on the active-DC deny-list.
  prod1:
    <<: *clickhouse
    hostname: prod1
    environment: { <<: *chenv, KEEPER_ID: "1", REPLICA: prod1 }
    volumes: ["./clickhouse/prod-dr-keeper.xml:/etc/clickhouse-server/config.d/prod-dr-keeper.xml:ro", "./clickhouse/prod.xml:/etc/clickhouse-server/config.d/prod.xml:ro"]
    networks: { demo: { ipv4_address: 172.28.0.11 } }

  prod2:
    <<: *clickhouse
    hostname: prod2
    environment: { <<: *chenv, KEEPER_ID: "2", REPLICA: prod2 }
    volumes: ["./clickhouse/prod-dr-keeper.xml:/etc/clickhouse-server/config.d/prod-dr-keeper.xml:ro", "./clickhouse/prod.xml:/etc/clickhouse-server/config.d/prod.xml:ro"]
    networks: { demo: { ipv4_address: 172.28.0.12 } }

  prod3:
    <<: *clickhouse
    hostname: prod3
    environment: { <<: *chenv, KEEPER_ID: "3", REPLICA: prod3 }
    volumes: ["./clickhouse/prod-dr-keeper.xml:/etc/clickhouse-server/config.d/prod-dr-keeper.xml:ro", "./clickhouse/prod.xml:/etc/clickhouse-server/config.d/prod.xml:ro"]
    networks: { demo: { ipv4_address: 172.28.0.13 } }

  # The PASSIVE DR data centre (3 replicas of the same shard + Keepers that cannot lead): the tool's only source.
  dr1:
    <<: *clickhouse
    hostname: dr1
    environment: { <<: *chenv, KEEPER_ID: "4", REPLICA: dr1 }
    volumes: ["./clickhouse/prod-dr-keeper.xml:/etc/clickhouse-server/config.d/prod-dr-keeper.xml:ro", "./clickhouse/dr.xml:/etc/clickhouse-server/config.d/dr.xml:ro"]
    networks: { demo: { ipv4_address: 172.28.0.21 } }

  dr2:
    <<: *clickhouse
    hostname: dr2
    environment: { <<: *chenv, KEEPER_ID: "5", REPLICA: dr2 }
    volumes: ["./clickhouse/prod-dr-keeper.xml:/etc/clickhouse-server/config.d/prod-dr-keeper.xml:ro", "./clickhouse/dr.xml:/etc/clickhouse-server/config.d/dr.xml:ro"]
    networks: { demo: { ipv4_address: 172.28.0.22 } }

  dr3:
    <<: *clickhouse
    hostname: dr3
    environment: { <<: *chenv, KEEPER_ID: "6", REPLICA: dr3 }
    volumes: ["./clickhouse/prod-dr-keeper.xml:/etc/clickhouse-server/config.d/prod-dr-keeper.xml:ro", "./clickhouse/dr.xml:/etc/clickhouse-server/config.d/dr.xml:ro"]
    networks: { demo: { ipv4_address: 172.28.0.23 } }

  # The shared non-production target qa1: 1 shard x 3 replicas with its own Keepers.
  qa1-1:
    <<: *clickhouse
    hostname: qa1-1
    environment: { <<: *chenv, KEEPER_ID: "1", REPLICA: qa1-1 }
    volumes: ["./clickhouse/qa1.xml:/etc/clickhouse-server/config.d/qa1.xml:ro"]
    networks: { demo: { ipv4_address: 172.28.0.31 } }

  qa1-2:
    <<: *clickhouse
    hostname: qa1-2
    environment: { <<: *chenv, KEEPER_ID: "2", REPLICA: qa1-2 }
    volumes: ["./clickhouse/qa1.xml:/etc/clickhouse-server/config.d/qa1.xml:ro"]
    networks: { demo: { ipv4_address: 172.28.0.32 } }

  qa1-3:
    <<: *clickhouse
    hostname: qa1-3
    environment: { <<: *chenv, KEEPER_ID: "3", REPLICA: qa1-3 }
    volumes: ["./clickhouse/qa1.xml:/etc/clickhouse-server/config.d/qa1.xml:ro"]
    networks: { demo: { ipv4_address: 172.28.0.33 } }

  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16}
    environment: { POSTGRES_DB: chrepl, POSTGRES_USER: chrepl, POSTGRES_PASSWORD: chrepl-demo }
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chrepl"]
      interval: 2s
      retries: 30
    networks: { demo: { ipv4_address: 172.28.0.40 } }

  # DEVELOPMENT-ONLY identity provider (modules/devidp): pick a user, no password.
  devidp:
    image: cgr.dev/chainguard/jre:latest@sha256:4a28de032c54fde58541376fc758b1449ca822e89b49847dbcb8887fb8bacf17
    entrypoint: ["java", "-cp", "/devidp/lib/*", "chrepl.devidp.DevIdpKt",
                 "--port", "9000", "--bind", "0.0.0.0", "--issuer", "http://localhost:9000", "--redirect", "http://localhost:8080/"]
    volumes: ["../modules/devidp/build/install/chrepl-devidp:/devidp:ro"]
    ports: ["127.0.0.1:9000:9000"]
    networks: { demo: { ipv4_address: 172.28.0.50 } }

  app:
    build: { context: .., dockerfile: Dockerfile }
    image: clickhouse-repl:demo
    profiles: [app]   # started by run.sh once the ClickHouse users exist
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      CHREPL_CONFIG: /etc/chrepl/replicator.yaml
      CHREPL_ROLES: all
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/chrepl
      SPRING_DATASOURCE_USERNAME: chrepl
      SPRING_DATASOURCE_PASSWORD: chrepl-demo
      # Tokens say iss=http://localhost:9000 (the browser's view); keys are fetched inside the network.
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://devidp:9000/jwks
      CHREPL_PORTAL_ISSUER: http://localhost:9000
    volumes:
      - ./config:/etc/chrepl:ro
      - ./.secrets:/var/run/secrets/chrepl:ro
    ports: ["127.0.0.1:8080:8080"]
    networks: { demo: { ipv4_address: 172.28.0.60 } }

networks:
  demo:
    ipam:
      config: [{ subnet: 172.28.0.0/24 }]
