# clickhouse-repl demo: "prod" and "DR" replicas (ReplicatedMergeTree via Keeper), a qa1 target,
# Postgres, a development-only OIDC provider and the app. See demo/run.sh. Not for production.
name: chrepl-demo

x-clickhouse: &clickhouse
  image: ${CLICKHOUSE_IMAGE:-clickhouse/clickhouse-server:25.8}
  environment:
    CLICKHOUSE_SKIP_USER_SETUP: "1"
    CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"

services:
  keeper:
    <<: *clickhouse
    hostname: keeper
    volumes: ["./clickhouse/keeper.xml:/etc/clickhouse-server/config.d/demo.xml:ro"]
    networks: { demo: { ipv4_address: 172.28.0.5 } }

  # The ACTIVE data centre. The tool must never connect here: it is on the active-DC deny-list.
  prod:
    <<: *clickhouse
    hostname: prod
    depends_on: [keeper]
    volumes: ["./clickhouse/prod.xml:/etc/clickhouse-server/config.d/demo.xml:ro"]
    networks: { demo: { ipv4_address: 172.28.0.10 } }

  # The PASSIVE DR replica: the tool's only source.
  dr:
    <<: *clickhouse
    hostname: dr
    depends_on: [keeper]
    volumes: ["./clickhouse/dr.xml:/etc/clickhouse-server/config.d/demo.xml:ro"]
    networks: { demo: { ipv4_address: 172.28.0.20 } }

  # A shared non-production target.
  qa1:
    <<: *clickhouse
    hostname: qa1
    networks: { demo: { ipv4_address: 172.28.0.30 } }

  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16}
    environment: { POSTGRES_DB: chrepl, POSTGRES_USER: chrepl, POSTGRES_PASSWORD: chrepl-demo }
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chrepl"]
      interval: 2s
      retries: 30
    networks: { demo: { ipv4_address: 172.28.0.40 } }

  # DEVELOPMENT-ONLY identity provider (modules/devidp): pick a user, no password.
  devidp:
    image: cgr.dev/chainguard/jre:latest@sha256:4a28de032c54fde58541376fc758b1449ca822e89b49847dbcb8887fb8bacf17
    entrypoint: ["java", "-cp", "/devidp/lib/*", "chrepl.devidp.DevIdpKt",
                 "--port", "9000", "--bind", "0.0.0.0", "--issuer", "http://localhost:9000", "--redirect", "http://localhost:8080/"]
    volumes: ["../modules/devidp/build/install/chrepl-devidp:/devidp:ro"]
    ports: ["127.0.0.1:9000:9000"]
    networks: { demo: { ipv4_address: 172.28.0.50 } }

  app:
    build: { context: .., dockerfile: Dockerfile }
    image: clickhouse-repl:demo
    profiles: [app]   # started by run.sh once the ClickHouse users exist
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      CHREPL_CONFIG: /etc/chrepl/replicator.yaml
      CHREPL_ROLES: all
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/chrepl
      SPRING_DATASOURCE_USERNAME: chrepl
      SPRING_DATASOURCE_PASSWORD: chrepl-demo
      # Tokens say iss=http://localhost:9000 (the browser's view); keys are fetched inside the network.
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://devidp:9000/jwks
      CHREPL_PORTAL_ISSUER: http://localhost:9000
    volumes:
      - ./config:/etc/chrepl:ro
      - ./.secrets:/var/run/secrets/chrepl:ro
    ports: ["127.0.0.1:8080:8080"]
    networks: { demo: { ipv4_address: 172.28.0.60 } }

networks:
  demo:
    ipam:
      config: [{ subnet: 172.28.0.0/24 }]
