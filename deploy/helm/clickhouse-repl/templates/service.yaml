apiVersion: v1
kind: Service
metadata:
  name: {{ include "chrepl.fullname" . }}
  labels: {{- include "chrepl.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "chrepl.selector" . | nindent 4 }}
    app.kubernetes.io/component: api
  ports:
    - { name: http, port: 80, targetPort: http }
