name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build, lint and test
        run: ./gradlew check installDist --console=plain

      - name: Validate example configuration
        run: modules/cli/build/install/clickhouse-repl/bin/clickhouse-repl validate-config docs/examples/replicator.yaml

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: modules/*/build/reports/tests/

  integration:
    runs-on: ubuntu-latest
    needs: build
    strategy:
      fail-fast: false
      matrix:
        clickhouse: ["25.8", "26.8"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Pull ClickHouse ${{ matrix.clickhouse }}
        run: docker pull clickhouse/clickhouse-server:${{ matrix.clickhouse }}

      - name: Integration tests (Docker)
        run: ./gradlew :it:test -Pit -Pchrepl.it.image=clickhouse/clickhouse-server:${{ matrix.clickhouse }} --console=plain

      - name: Upload integration test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: it-reports-${{ matrix.clickhouse }}
          path: modules/it/build/reports/tests/
