name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: modules/portal/package-lock.json

      - uses: gradle/actions/setup-gradle@v4

      - name: Build, lint and test
        run: ./gradlew check installDist :app:bootJar --console=plain

      - name: Validate example configuration
        run: modules/cli/build/install/clickhouse-repl/bin/clickhouse-repl validate-config docs/examples/replicator.yaml

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: modules/*/build/reports/tests/

  security:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: modules/portal/package-lock.json

      - uses: gradle/actions/setup-gradle@v4

      - name: Install OSV-Scanner
        run: |
          curl -sSfL -o osv-scanner https://github.com/google/osv-scanner/releases/download/v2.2.4/osv-scanner_linux_amd64
          chmod +x osv-scanner

      - name: Scan dependency lockfiles (Gradle, npm)
        run: ./osv-scanner scan source -r --no-ignore modules/

      - name: npm audit
        working-directory: modules/portal
        run: npm ci --no-audit --no-fund && npm audit --audit-level=low

      - name: Build and scan the container image
        run: |
          ./gradlew :app:bootJar --console=plain
          docker build -t clickhouse-repl:ci .
          ./osv-scanner scan image clickhouse-repl:ci

  deploy-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v5
        with:
          version: v3.19.0

      - name: Helm lint and render
        run: |
          helm lint deploy/helm/clickhouse-repl --set config.replicatorYaml="version: 1"
          helm template t deploy/helm/clickhouse-repl --set config.replicatorYaml="version: 1" > rendered.yaml

      - name: Validate Kubernetes manifests
        run: |
          curl -sSfL https://github.com/yannh/kubeconform/releases/download/v0.7.0/kubeconform-linux-amd64.tar.gz | tar xz kubeconform
          ./kubeconform -strict -summary -ignore-missing-schemas rendered.yaml

      - name: Check and test Prometheus rules
        working-directory: deploy/monitoring
        run: |
          curl -sSfL https://github.com/prometheus/prometheus/releases/download/v3.7.2/prometheus-3.7.2.linux-amd64.tar.gz | tar xz --strip-components=1 prometheus-3.7.2.linux-amd64/promtool
          ./promtool check rules alerts.yaml
          ./promtool test rules alerts.test.yaml

  integration:
    runs-on: ubuntu-latest
    needs: build
    strategy:
      fail-fast: false
      matrix:
        clickhouse: ["25.8", "26.8"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: modules/portal/package-lock.json

      - uses: gradle/actions/setup-gradle@v4

      - name: Pull ClickHouse ${{ matrix.clickhouse }}
        run: docker pull clickhouse/clickhouse-server:${{ matrix.clickhouse }}

      - name: Integration tests (Docker)
        run: ./gradlew :it:test -Pit -Pchrepl.it.image=clickhouse/clickhouse-server:${{ matrix.clickhouse }} --console=plain

      - name: Upload OpenAPI document
        if: success() && matrix.clickhouse == '25.8'
        uses: actions/upload-artifact@v4
        with:
          name: openapi
          path: modules/it/build/openapi/openapi.json

      - name: Upload integration test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: it-reports-${{ matrix.clickhouse }}
          path: modules/it/build/reports/tests/

  portal-e2e:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: modules/portal/package-lock.json

      - uses: gradle/actions/setup-gradle@v4

      - name: Install Chromium for Playwright
        working-directory: modules/portal
        run: npm ci --no-audit --no-fund && npx playwright install --with-deps chromium

      - name: Portal E2E (Playwright + axe against the dockerised stack)
        run: ./gradlew :it:test -Pit -Pe2e --tests '*PortalE2EIT*' --console=plain

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            modules/portal/playwright-report/
            modules/portal/test-results/
            modules/portal/build/e2e.log
